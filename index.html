<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hangulatnapló</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="add.html">Új bejegyzés</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Bejegyzések</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="stat.html">Statisztikák</a>
                </li>
            </ul>
        </div>
    </nav>
    
    <h1>Bejegyzések</h1>
    <table class="table">
      <thead>
        <tr>
          <th>Dátum</th>
          <th>Hangulat</th>
          <th>Leírás</th>
          <th>Műveletek</th>
        </tr>
      </thead>
      <tbody id="content">
      </tbody>
    </table>

    <h2>Szerkesztő</h2>

    <form id="szerkeszto">
        <div class="mb-3">
            <label for="hangulatSelectSzerkeszto" class="form-label">Hangulat:</label>
            <select type="select" class="form-select" name="hangulatSzerkeszto" id="hangulatSelectSzerkeszto">
                <option value="😀">😀</option>
                <option value="😐">😐</option>
                <option value="😢">😢</option>
                <option value="😴">😴</option>
                <option value="😡">😡</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="descriptionSzerkeszto" class="form-label">Description</label>
            <textarea class="form-control" name="descriptionSzerkeszto" id="descriptionSzerkeszto" rows="3"></textarea>
        </div>
        <button type="submit" id="szerkesztesSubmit" class="btn btn-primary">Szerkesztés</button>
    </form>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
